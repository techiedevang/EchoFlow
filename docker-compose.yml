version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/echoflow
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - PORT=5000
    depends_on:
      - mongodb
    networks:
      - echoflow-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:3000"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend
    networks:
      - echoflow-network

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=echoflow
    volumes:
      - mongodb_data:/data/db
    networks:
      - echoflow-network

networks:
  echoflow-network:
    driver: bridge

volumes:
  mongodb_data:
